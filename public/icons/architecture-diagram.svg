<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <defs>
    <linearGradient id="uiGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="appGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serviceGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="domainGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#0f172a"/>
  <rect x="20" y="20" width="860" height="660" rx="20" fill="#1e293b" filter="url(#shadow)"/>
  
  <!-- Title -->
  <text x="450" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="bold" fill="#f8fafc">
    AquaQA - Layered Architecture
  </text>
  <text x="450" y="90" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8">
    Full Stack Next.js Feature-Based Architecture
  </text>
  
  <!-- UI Layer -->
  <g transform="translate(50, 120)">
    <rect width="800" height="110" rx="12" fill="url(#uiGradient)" filter="url(#shadow)"/>
    <text x="400" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="white">UI LAYER</text>
    <text x="400" y="50" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">Presentation &amp; User Interaction</text>
    
    <!-- UI Components -->
    <rect x="20" y="60" width="110" height="40" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="75" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white">Pages</text>
    
    <rect x="145" y="60" width="110" height="40" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="200" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white">Components</text>
    
    <rect x="270" y="60" width="110" height="40" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="325" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white">Layouts</text>
    
    <rect x="395" y="60" width="110" height="40" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="450" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white">Hooks</text>
    
    <rect x="520" y="60" width="110" height="40" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="575" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white">Forms</text>
    
    <rect x="645" y="60" width="135" height="40" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="712" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white">State (Zustand)</text>
  </g>
  
  <!-- Arrow 1 -->
  <g transform="translate(450, 235)">
    <polygon points="0,0 -12,15 -5,15 -5,30 5,30 5,15 12,15" fill="#94a3b8"/>
  </g>
  
  <!-- Application Layer -->
  <g transform="translate(50, 270)">
    <rect width="800" height="110" rx="12" fill="url(#appGradient)" filter="url(#shadow)"/>
    <text x="400" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="white">APPLICATION LAYER</text>
    <text x="400" y="50" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">Use Cases &amp; Business Logic Orchestration</text>
    
    <!-- Application Components -->
    <rect x="40" y="60" width="140" height="40" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="110" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white">API Routes</text>
    
    <rect x="200" y="60" width="140" height="40" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="270" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white">Server Actions</text>
    
    <rect x="360" y="60" width="140" height="40" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="430" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white">Controllers</text>
    
    <rect x="520" y="60" width="140" height="40" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="590" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white">Validators</text>
    
    <rect x="680" y="60" width="100" height="40" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="730" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white">DTOs</text>
  </g>
  
  <!-- Arrow 2 -->
  <g transform="translate(450, 385)">
    <polygon points="0,0 -12,15 -5,15 -5,30 5,30 5,15 12,15" fill="#94a3b8"/>
  </g>
  
  <!-- Services Layer -->
  <g transform="translate(50, 420)">
    <rect width="800" height="110" rx="12" fill="url(#serviceGradient)" filter="url(#shadow)"/>
    <text x="400" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="white">SERVICES LAYER</text>
    <text x="400" y="50" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">Business Services &amp; External Integrations</text>
    
    <!-- Services Components -->
    <rect x="30" y="60" width="145" height="40" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="102" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white">Auth Service</text>
    
    <rect x="190" y="60" width="145" height="40" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="262" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white">Email Service</text>
    
    <rect x="350" y="60" width="145" height="40" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="422" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white">QA Service</text>
    
    <rect x="510" y="60" width="145" height="40" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="582" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white">Report Service</text>
    
    <rect x="670" y="60" width="110" height="40" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="725" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white">Repositories</text>
  </g>
  
  <!-- Arrow 3 -->
  <g transform="translate(450, 535)">
    <polygon points="0,0 -12,15 -5,15 -5,30 5,30 5,15 12,15" fill="#94a3b8"/>
  </g>
  
  <!-- Domain Layer -->
  <g transform="translate(50, 570)">
    <rect width="800" height="95" rx="12" fill="url(#domainGradient)" filter="url(#shadow)"/>
    <text x="400" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="white">DOMAIN LAYER</text>
    <text x="400" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">Core Business Entities &amp; Rules</text>
    
    <!-- Domain Components -->
    <rect x="60" y="58" width="130" height="30" rx="6" fill="rgba(255,255,255,0.25)"/>
    <text x="125" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white">Entities</text>
    
    <rect x="210" y="58" width="130" height="30" rx="6" fill="rgba(255,255,255,0.25)"/>
    <text x="275" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white">Types/Interfaces</text>
    
    <rect x="360" y="58" width="130" height="30" rx="6" fill="rgba(255,255,255,0.25)"/>
    <text x="425" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white">Enums</text>
    
    <rect x="510" y="58" width="130" height="30" rx="6" fill="rgba(255,255,255,0.25)"/>
    <text x="575" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white">Value Objects</text>
    
    <rect x="660" y="58" width="130" height="30" rx="6" fill="rgba(255,255,255,0.25)"/>
    <text x="725" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white">Prisma Models</text>
  </g>
  
  <!-- Side Labels -->
  <g transform="translate(15, 350)">
    <text transform="rotate(-90)" x="0" y="0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">
      ← Higher Abstraction
    </text>
  </g>
  
  <g transform="translate(885, 350)">
    <text transform="rotate(90)" x="0" y="0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">
      Lower Abstraction →
    </text>
  </g>
  
  <!-- Next.js Badge -->
  <g transform="translate(750, 35)">
    <rect width="100" height="30" rx="15" fill="#000000" stroke="#ffffff" stroke-width="1"/>
    <text x="50" y="20" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Next.js 14</text>
  </g>
</svg>
